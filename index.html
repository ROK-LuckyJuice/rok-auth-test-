<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROK-Guide 인증 테스트 (운영 사이트 별도)</title><style>body{font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:24px}main{max-width:510px;margin:30px auto;background:#1f2937;padding:26px;border-radius:18px}h1{font-size:23px}label{display:block;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:8px;border:1px solid #9ca3af}button{padding:12px 18px;border:0;border-radius:8px;margin:14px 8px 0 0;font-size:15px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;padding:16px;border-radius:8px}small{color:#cbd5e1}#captcha{margin-top:18px}</style></head><body><main><h1>🦉 ROK-Guide 가입·로그인 테스트</h1><p>운영 사이트를 변경하지 않는 별도 테스트 페이지입니다. <strong>실제 Supabase에 테스트 계정이 생성됩니다.</strong></p><small>본인만 아는 새 테스트 비밀번호를 사용하세요. 이 페이지는 로그인 토큰을 저장하지 않으며 서버 응답의 토큰도 화면에 표시하지 않습니다.</small><label for="nickname">테스트 닉네임 (2~20자)</label><input id="nickname" autocomplete="off" maxlength="20" placeholder="예: ROK테스트123"><label for="password">테스트 비밀번호 (8~128자)</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="기존 비밀번호 재사용 금지"><div id="captcha"></div><div><button id="register" disabled>① 새 닉네임 등록</button><button id="login" disabled>② 닉네임 로그인</button></div><pre id="result" role="status">Turnstile 로딩 중...</pre><small>가입에 성공하면 같은 닉네임·비밀번호로 다시 보안 인증을 완료하고 로그인 버튼을 누르세요. 테스트 후 계정 삭제는 별도 관리 작업이 필요합니다.</small></main><script>
const API='https://ncfgwsgwohligwwlemcw.supabase.co/functions/v1/rok-nickname-auth';
const KEY='sb_publishable_65uGXHJw36zlPK0ovhPUOA_trFLWh3j';
const SITE='0x4AAAAAAGLGmcMHaMs4El1B';
const $=id=>document.getElementById(id);let widget=null,busy=false;
function report(s){$('result').textContent=s}
function setBusy(v){busy=v;$('register').disabled=v;$('login').disabled=v}
window.onTurnstileReady=()=>{try{widget=turnstile.render('#captcha',{sitekey:SITE,theme:'auto'});setBusy(false);report('보안 인증을 완료한 뒤 ① 등록 또는 ② 로그인을 선택하세요.')}catch(e){report('Turnstile 표시 실패: '+e.message)}};
async function run(action){if(busy)return;const nickname=$('nickname').value.trim(),password=$('password').value;if(nickname.length<2||nickname.length>20||password.length<8||password.length>128){report('닉네임 2~20자, 비밀번호 8~128자를 입력해 주세요.');return}const challenge=window.turnstile&&widget!==null?turnstile.getResponse(widget):'';if(!challenge){report('먼저 Turnstile 보안 인증을 완료해 주세요.');return}setBusy(true);report('서버에 요청 중...');try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,nickname,password,challenge})});const data=await res.json().catch(()=>({}));if(res.ok&&data.access_token&&data.refresh_token){report('HTTP '+res.status+' — '+(action==='register'?'회원가입':'로그인')+' 성공! 서버가 로그인 토큰을 발급했습니다. (토큰은 표시하거나 저장하지 않음)')}else{report('HTTP '+res.status+' — '+(data.error||'인증 실패 / 예상하지 못한 응답'))}}catch(e){report('네트워크 오류: '+e.message)}finally{try{if(widget!==null)turnstile.reset(widget)}catch{}setBusy(false)}}
$('register').onclick=()=>run('register');$('login').onclick=()=>run('login');
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileReady&render=explicit" async defer></script></body></html>
